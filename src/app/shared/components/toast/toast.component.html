<div
  *ngIf="toastService.toast$ | async as toast"
  class="toast-container position-fixed top-0 end-0 p-3"
  style="z-index: 2000"
>
  <div
    class="toast show align-items-center text-white"
    [ngClass]="toast.type === 'success' ? 'bg-success' : 'bg-danger'"
  >
    <div class="d-flex">
      <div class="toast-body">
        <i
          class="fas"
          [ngClass]="
            toast.type === 'success'
              ? 'fa-check-circle'
              : 'fa-exclamation-triangle'
          "
        ></i>
        {{ toast.message }}
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        aria-label="Close"
        (click)="toastService.clear()"
      ></button>
    </div>
  </div>
</div>
